version: v0.4
project:
  name: Rational Recovery on a Common Ruler
  description: >-
    For the rational plane curve parametrization
    x ↦ ((x-1)/x^n, (x-1)^2/(x-K)^m) with real K>1 and integers n,m at least two,
    the index of its coordinate field in R(x) is one except at (n,m,K)=(2,4,2),
    where it is two. In the exceptional case the involution x ↦ x/(x-1)
    preserves both coordinates.
  authors: [Stephanie Alexander]
  responsible_maintainers: [Stephanie Alexander]
  license: MIT
repository:
  role: substantive-development
classification:
  arxiv: [math.AG, cs.SC]
  msc2020: [14H50, 12F05, 68W30]
