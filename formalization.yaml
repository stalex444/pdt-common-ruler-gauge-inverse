status:
  scope: >-
    Computes the joint function-field index for real K>1 and all integer pole orders n,m at least two.
    The field equality is generic rational recovery. The explicit expression requires a nonzero denominator.
    Separately proves inversion of the specified gauge map on real bases a,b greater than one at a fixed positive natural exponent.
    The exact two-input example uses p=15 and fixed decimal centers, with branches and the strong predictions
    enclosed by rationals. The general compatibility theorem assumes a positive weak reading and an admissible solution of the ratio cubic.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: agent
      models: [OpenAI GPT-6]
      framework: OpenAI Codex in ChatGPT Work Mode
      tool_setup: Pinned Lean and Mathlib, Lake comparator, exact polynomial gcd and remainder checks in SymPy, and numerical replay in mpmath.
      cost:
        wall_time: not tracked
        spend_usd: not tracked
        hardware: local machine
      prompting_notes: Stephanie Alexander requested a formal inverse theorem for her three gauge formulas, and a revision of the resulting package. The two-generator family varies the denominator orders in the fixed-ruler formulas.
  spend_usd: not tracked
  notes: AI-assisted mathematical development, proof implementation and numerical cross-checks.
fidelity:
  divergences: >-
    The general field theorem concerns the specified family over all allowable parameters. The gauge application uses real functions from the earlier registration. The empirical inputs mix the low-energy
    electromagnetic convention and Z-scale MS-bar quantities. Their reported uncertainties and the experimental
    strong value are used in the documentation. The formal statements concern the specified maps and exact
    rounded centers. The fitted bases differ from the cubic and quartic roots. A dynamical derivation or
    common-scale evolution of the gauge couplings is outside the formal claim.
review:
  status: self-assessed
  reviewers: []
  notes: Local kernel verification and independent exact polynomial and numerical checks. The classification is stated for this particular family.
