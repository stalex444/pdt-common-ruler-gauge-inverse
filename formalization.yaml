  methods:
    - method: agent
      models: [OpenAI GPT-6]
      framework: OpenAI Codex in ChatGPT Work Mode
      tool_setup: Pinned Lean and Mathlib, Lake comparator, and exact bivariate polynomial gcd checks in SymPy.
      cost:
        wall_time: not tracked
        spend_usd: not tracked
        hardware: local machine
      prompting_notes: The two-generator problem arose by independently varying the pole orders in Stephanie Alexander’s common-ruler functions.
  spend_usd: not tracked
  notes: AI-assisted mathematical development, proof implementation and exact cross-checks.
fidelity:
  divergences: >-
    The Lean statement uses the finite-dimensional vector-space dimension of the rational function field
    over the intermediate field generated by the two coordinates. It quantifies over real pole locations
    greater than one and natural-number pole orders at least two.
