status:
  scope: >-
    The selected theorem computes the index of the field generated by the two coordinates in R(x)
    for K>1 and integral pole orders n,m at least two. Index one means birationality at the
    generic point. The exceptional index is exactly two.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
