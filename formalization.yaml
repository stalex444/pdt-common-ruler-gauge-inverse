version: v0.4
project:
  name: Rational Recovery on a Common Ruler
  description: >-
    Classifies the field generated by F=(x-1)/x^n and G=(x-1)^2/(x-K)^m for every
    real K>1 and all integers n,m at least two. Each reading alone leaves degree n or m.
    The joint field has index one except at (n,m,K)=(2,4,2), where its index is two.
    Away from m=2n the proof works over any field with K distinct from zero and one.
    The common-ruler gauge formulas have pole orders (7,3). We give an explicit rational
    inversion on its stated domain and certify both real branches and their strong
    outputs for the exponent-15 electroweak example.
  authors: [Stephanie Alexander]
  responsible_maintainers: [Stephanie Alexander]
  license: MIT
