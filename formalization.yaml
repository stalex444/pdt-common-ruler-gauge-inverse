version: v0.4
project:
  name: Three Gauge Couplings on a Common Ruler
  description: >-
    At exponent 15, the electromagnetic and weak central inputs 137.036 and 0.23121
    admit exactly two pairs of real bases greater than one in the specified PDT formulas.
    Their strong readings lie in [0.01923413, 0.01923414] and [0.11728454, 0.11728455].
    Electromagnetism fixes the product K=ab. The weak response turns at b=7/6, while
    the strong-to-weak ratio strictly increases. The root greater than one of x⁴=x+1
    lies on the falling side. For any fixed positive integer exponent the three exact
    readings jointly identify both bases. A cubic recovers the unique split with a
    proposed positive strong-to-weak ratio, and substitution gives an exact compatibility test.
  authors: [Stephanie Alexander]
  responsible_maintainers: [Stephanie Alexander]
  license: MIT
