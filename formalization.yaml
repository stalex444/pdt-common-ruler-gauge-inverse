    authors: [Stephanie Alexander]
    type: original-proof
    relationship: other
    location: README.md, Challenge.lean, Classification.lean and CommonRuler/{FieldDegree,FunctionField,Resonance}.lean
    note: Uniform classification of the joint field index, including the exceptional quadratic subfield.
  - title: Tracing index of rational curve parametrizations
    authors: [J. Rafael Sendra, Franz Winkler]
    id: https://doi.org/10.1016/S0167-8396(01)00069-3
    type: paper
    relationship: background
    author_endorsement: not-contacted
    note: Tracing index and degree of a rational parametrization.
  - title: A Rational Function Decomposition Algorithm by Near-separated Polynomials
    authors: [César Alonso, Jaime Gutiérrez, Tomás Recio]
    id: https://doi.org/10.1006/jsco.1995.1030
    type: paper
    relationship: background
    author_endorsement: not-contacted
    note: Rational function decomposition and tests of birationality through common polynomial factors.
